<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111d">
  <title>风险路网全屏地图</title>
  <link rel="icon" href="{{ url_for('static', filename='pic/cloud.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="map-view-page">
  <main class="standalone-map">
    <header class="standalone-map__header">
      <div>
        <span class="eyebrow">ROAD NETWORK · FULL VIEW</span>
        <h1>风险路网态势</h1>
      </div>
      <a href="{{ url_for('dashboard') }}">← 返回监测大屏</a>
    </header>
    <div class="standalone-map__canvas">
      <div id="map" class="map-canvas" aria-label="成都市高速公路风险点位地图"></div>
      <div id="mapFallback" class="map-fallback" hidden></div>
      <div class="map-legend">
        <span><i class="map-dot map-dot--normal"></i>正常点位</span>
        <span><i class="map-dot map-dot--risk"></i>风险点位</span>
      </div>
    </div>
  </main>

  {% if baidu_map_ak %}
  <script src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak={{ baidu_map_ak | urlencode }}"></script>
  {% endif %}
  <script type="module" src="{{ url_for('static', filename='js/map-view.js') }}"></script>
</body>
</html>
